name: Repair complete consumer SDK runtime

on:
  push:
    branches: [consumer]
    paths: [.github/workflows/repair-sdk-runtime.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consumer
          fetch-depth: 1
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.gitignore
            /README.md
            /ROADMAP.md
            /SHA256SUMS.txt
            /platforms/windows-x64/INSTALL.md
            /platforms/windows-x64/RELEASE.json
            /platforms/windows-x64/SHA256SUMS.txt
            /platforms/windows-x64/stage0/
            /platforms/*.tar.xz
            /.github/workflows/repair-sdk-runtime.yml
      - name: Fetch pinned synchronization code and complete public manifest
        run: |
          set -euo pipefail
          site="https://raw.githubusercontent.com/RyanEid06/Rocket-RocketIDE/52f8d649fbe998f1203fde18b698784a7a06626b"
          curl --fail --location --retry 3 "$site/scripts/sync_consumer_distribution.py" -o "$RUNNER_TEMP/sync_consumer.py"
          curl --fail --location --retry 3 "$site/public/downloads.json" -o "$RUNNER_TEMP/downloads.json"
      - name: Synchronize runtime bytes, preserve existing binaries, and verify LFS
        run: |
          set -euo pipefail
          git lfs install --local
          git rm .github/workflows/repair-sdk-runtime.yml
          python "$RUNNER_TEMP/sync_consumer.py" --product rocket --repo "$PWD" --manifest "$RUNNER_TEMP/downloads.json" --archives "$RUNNER_TEMP/sdk-archives"
          git add .gitattributes README.md SHA256SUMS.txt platforms/windows-x64/INSTALL.md platforms/windows-x64/RELEASE.json platforms/windows-x64/SHA256SUMS.txt platforms/windows-x64/stage0/rocketc-stage0.exe platforms/*.tar.xz
          python - <<'PY'
          import hashlib, pathlib, subprocess
          paths = set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          inventory = {n:h for h,n in (line.split('  ',1) for line in pathlib.Path('SHA256SUMS.txt').read_text().splitlines())}
          assert paths - {'SHA256SUMS.txt'} == set(inventory)
          lfs = [n for n in paths if n.endswith('.tar.xz') or n == 'platforms/windows-x64/stage0/rocketc-stage0.exe']
          assert len(lfs) == 4
          for name in lfs:
              pointer = subprocess.check_output(['git','show',':'+name],text=True)
              assert 'oid sha256:'+inventory[name] in pointer
              with pathlib.Path(name).open('rb') as stream:
                  assert hashlib.file_digest(stream,'sha256').hexdigest() == inventory[name]
          print('Exact consumer inventory and all four new Git LFS object identities verified.')
          PY
          git diff --cached --check
      - name: Publish repaired consumer branch with required LFS objects
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore matching runtime hosts in all consumer SDKs'
          git push origin HEAD:consumer
          git show --stat --oneline HEAD
