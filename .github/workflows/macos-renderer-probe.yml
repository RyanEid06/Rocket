name: Temporary macOS renderer probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.runner }} NSGL probe
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Probe accelerated, offline, and software pixel formats
        run: |
          clang++ -std=c++20 tests/native/macos_nsgl_probe.cpp \
            -framework OpenGL -o /tmp/macos_nsgl_probe
          /tmp/macos_nsgl_probe
