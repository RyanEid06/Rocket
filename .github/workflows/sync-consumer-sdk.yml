name: Sync cleaned Rocket SDK consumer packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consumer
          fetch-depth: 1
          lfs: false
      - name: Download and verify the four published consumer archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh api repos/RyanEid06/Rocket-RocketIDE/releases/tags/v3.0.0 > candidate/release.json
          gh release download v3.0.0 -R RyanEid06/Rocket-RocketIDE \
            -p 'Rocket-SDK-3.0.0-windows-x64.zip' \
            -p 'Rocket-SDK-3.0.0-linux-x64.tar.xz' \
            -p 'Rocket-SDK-3.0.0-linux-arm64.tar.xz' \
            -p 'Rocket-SDK-3.0.0-macos-arm64.tar.xz' -D candidate
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = json.loads(Path('candidate/release.json').read_text())
          assets = {item['name']: item for item in release['assets']}
          for target in ('windows-x64', 'linux-x64', 'linux-arm64', 'macos-arm64'):
              name = f'Rocket-SDK-3.0.0-{target}' + ('.zip' if target == 'windows-x64' else '.tar.xz')
              path = Path('candidate') / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert assets[name]['size'] == path.stat().st_size
              assert assets[name]['digest'] == f'sha256:{digest}'
              print(name, path.stat().st_size, digest)
          PY
      - name: Replace the four SDK consumer packages and instructions
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git rm -r -- platforms/windows-x64 \
            platforms/rocket-3.0.0-linux-x64.tar.xz \
            platforms/rocket-3.0.0-linux-arm64.tar.xz \
            platforms/rocket-3.0.0-macos-arm64.tar.xz
          mkdir -p candidate/windows-unpacked platforms/windows-x64
          unzip -q candidate/Rocket-SDK-3.0.0-windows-x64.zip -d candidate/windows-unpacked
          cp -a candidate/windows-unpacked/Rocket-SDK-3.0.0-windows-x64/. platforms/windows-x64/
          for target in linux-x64 linux-arm64 macos-arm64; do
            cp "candidate/Rocket-SDK-3.0.0-$target.tar.xz" platforms/
          done
          cat > README.md <<'EOF'
          # Rocket consumer SDK

          This branch contains ready-to-use Rocket 3.0.0 SDK packages for Windows x64,
          Linux x64, Linux ARM64, and macOS Apple Silicon ARM64. They originate from
          Rocket source commit `1f6ba76f16f3246095d5d573c28d825d8b9367e3`.
          The compiler reports 3.0.0; the included standard library has the game APIs
          present in that source commit.

          | Target | Consumer package |
          | --- | --- |
          | Windows x64 | `platforms/windows-x64/` |
          | Linux x64 | `platforms/Rocket-SDK-3.0.0-linux-x64.tar.xz` |
          | Linux ARM64 | `platforms/Rocket-SDK-3.0.0-linux-arm64.tar.xz` |
          | macOS Apple Silicon ARM64 | `platforms/Rocket-SDK-3.0.0-macos-arm64.tar.xz` |

          Each package contains production compiler and language-server launchers,
          toolchain and runtime libraries, standard library, target metadata,
          dependency licenses, installation instructions, checksums, and release metadata.
          Extract a complete Unix archive and follow its `INSTALL.md`. The Windows SDK
          is unpacked in `platforms/windows-x64/`; keep all files together and run
          `platforms/windows-x64/bin/rocketc.exe --version` from a Windows shell.
          On Ubuntu or Debian, install `libc6-dev libcurl4-openssl-dev` for native builds.
          On macOS, install Xcode Command Line Tools and use an active macOS SDK.

          The same SDK archives are available from the [published release](https://github.com/RyanEid06/Rocket-RocketIDE/releases/tag/v3.0.0).
          `SHA256SUMS.txt` covers distributed files in this branch. Install Git LFS
          before cloning so large binaries and archives are fetched as real files:

          ```sh
          git lfs install
          git clone --branch consumer --single-branch https://github.com/RyanEid06/Rocket.git
          ```

          `master` retains Rocket developer source and tests. RocketIDE is a separate
          Windows application; configure this SDK in its Tools > Rocket SDK Settings.
          EOF
          python - <<'PY'
          import hashlib
          from pathlib import Path
          manifest = Path('SHA256SUMS.txt')
          files = [Path(name) for name in ('.gitattributes', '.gitignore', 'README.md', 'ROADMAP.md')]
          files.extend(path for path in Path('platforms').rglob('*') if path.is_file())
          with manifest.open('w', encoding='ascii', newline='\n') as output:
              for path in sorted(files):
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  output.write(f'{digest}  {path.as_posix()}\n')
          PY
          git add -- README.md SHA256SUMS.txt \
            platforms/windows-x64 \
            platforms/Rocket-SDK-3.0.0-linux-x64.tar.xz \
            platforms/Rocket-SDK-3.0.0-linux-arm64.tar.xz \
            platforms/Rocket-SDK-3.0.0-macos-arm64.tar.xz
          git diff --cached --check
          git diff --cached --stat
      - name: Commit, push, and verify consumer branch alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: publish cleaned cross-platform consumer SDKs'
          git push origin HEAD:consumer
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/consumer | cut -f1)"
          test "$local_sha" = "$remote_sha"
          rm -rf -- candidate
          test -z "$(git status --porcelain)"
          echo "consumer=$local_sha"

